name: permit-copilot

services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      # 전국 공간데이터는 이미지에 넣지 않고 하나의 읽기 전용 볼륨으로 연결한다.
      FOREST_SQLITE_PATH: /data/processed/forest/forest_class.sqlite
      FOREST_INVENTORY_SQLITE_PATH: /data/processed/forest_inventory/forest_inventory.sqlite
      ECOLOGICAL_NATURE_SQLITE_PATH: /data/processed/ecological_nature_map/ecological_nature.sqlite
      ECOLOGICAL_SEPARATE_SQLITE_PATH: /data/processed/ecological_nature_map/separate_management.sqlite
      TERRAIN_DEM_PATH: /data/processed/terrain/dem/cop30_korea.tif
    volumes:
      # 패키지를 푼 processed 폴더를 지정한다. 미지정 시 로컬 가공 폴더를 쓴다.
      - ${SPATIAL_DATA_DIR:-./backend/data/processed}:/data/processed:ro
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/config', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_APP_TOKEN: ${APP_TOKEN:-}
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: "8000"
      HOST: 0.0.0.0
      PORT: "5173"
    ports:
      - "${APP_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
