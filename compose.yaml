name: permit-copilot

services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/config', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_APP_TOKEN: ${APP_TOKEN:-}
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: "8000"
      HOST: 0.0.0.0
      PORT: "5173"
    ports:
      - "${APP_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

